{% extends 'base/base_site.html' %}

{% load static %}

{% block title %}
Coleta de Amostras
{% endblock %}

{% block css %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'coleta/styles.css' %}">

{% endblock %}

{% block content %}
<div class="main-content">
    <div class="d-flex justify-content-center align-items-center" style="height: 50vh; width:100vh">
        <div class="card mx-auto" style="width: 100%; max-width: 50%;">
            <div class="card-body">
                <h5 class="card-title text-center">Cadastro de Amostras</h5>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-block">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
