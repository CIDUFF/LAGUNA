name: Site Status Monitor

on:
  schedule:
    - cron: '*/15 * * * *'  # Executa a cada 15 minutos
  workflow_dispatch:  # Permite execução manual

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check site status
        id: status_check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://laguna.app.br)
          echo "HTTP Status: $response"
          if [ "$response" != "200" ]; then
            echo "status=down" >> $GITHUB_OUTPUT
          else
            echo "status=up" >> $GITHUB_OUTPUT
          fi

      - name: Send notification email
        if: steps.status_check.outputs.status == 'down'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'ALERTA: laguna.app.br está fora do ar'
          to: marcusantonio@id.uff.br
          from: GitHub Actions
          body: |
            O site laguna.app.br está inacessível.
            
            Data/Hora: ${{ format(github.event.schedule) }}
            
            Este é um email automático, por favor não responda.