name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22022  # Especifica a porta de conexão SSH
          timeout: 60s  
          script: |
            cd /home/marcus/projects/LAGUNA
            git config --global credential.helper store
            echo "https://${{ secrets.REPO_ACCESS_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials
            git pull origin main
            . .venv/bin/activate
            python manage.py migrate
            sudo /etc/init.d/apache2 reload

      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: lagunasyst@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Deploy Successful'
          body: 'The deployment was successful.'
          to: marcusantonio@id.uff.br
          from: lagunasyst@gmail.com