name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22022 # porta de conexão do ultron
          timeout: 60s  
          script: |
            cd /home/marcus/projects/LAGUNA
            git pull origin main
            . .venv/bin/activate
            uv sync
            python manage.py migrate
            python manage.py collectstatic --noinput
            sudo /etc/init.d/apache2 reload

      - name: Enviar e-mail de sucesso
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: lagunasyst@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Deploy Realizado com Sucesso'
          body: 'O deploy foi concluído com sucesso.'
          to: marcusantonio@id.uff.br
          from: lagunasyst@gmail.com

      - name: Enviar e-mail de falha
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: lagunasyst@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Falha no Deploy'
          body: 'Ocorreu uma falha no deploy. Por favor, verifique os logs para mais detalhes.'
          to: marcusantonio@id.uff.br
          from: lagunasyst@gmail.com