{% extends 'base/base_site.html' %}
{% load static %}

{% block title %}
  Calendário de Campanhas
{% endblock %}

{% block content %}
<div class="container">
  <h2>Calendário de Campanhas</h2>
  <div id="calendar"></div>
</div>

<!-- Inclua as bibliotecas do FullCalendar -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales-all.min.js'></script> <!-- Inclua o arquivo de tradução -->

<script>
  document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'dayGridMonth',
      locale: 'pt-br',  // Configura o idioma para português
      events: {{ eventos|safe }}
    });
    calendar.render();
  });
</script>
{% endblock %}
