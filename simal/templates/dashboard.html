{% extends 'base/base_site.html' %}

{% block content %}
<div class="container mt-4">
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <a class="nav-link active" href="{% url 'resultados:dashboard' %}">Dados por Ponto</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'resultados:dashboard_medias' %}">Médias</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'resultados:grupos_list' %}">Grupos de Pontos</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{% url 'resultados:dados_ausentes' %}">Dados Ausentes</a>
        </li>
    </ul>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h2>Dashboard de Resultados</h2>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="parametro">Parâmetro:</label>
                            <select class="form-control" id="parametro">
                                <option value="">Selecione...</option>
                                {% for parametro in parametros %}
                                <option value="{{ parametro }}">{{ parametro }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="setor">Setor:</label>
                            <select class="form-control" id="setor">
                                <option value="">Todos</option>
                                {% for setor in setores %}
                                <option value="{{ setor }}">{{ setor }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="ponto">Ponto:</label>
                            <select class="form-control" id="ponto">
                                <option value="">Todos</option>
                                {% for ponto in pontos %}
                                <option value="{{ ponto }}">{{ ponto }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="grupo">Grupo de Pontos:</label>
                            <select class="form-control" id="grupo">
                                <option value="">Todos</option>
                                {% for grupo in grupos %}
                                <option value="{{ grupo.pk }}">{{ grupo.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12">
                        <button class="button" onclick="gerarGrafico()">Gerar Gráfico</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
                <div id="grafico" style="width:100%; min-height:600px;"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .button:hover {
            background-color: #45a049;
        }
        
        select {
            padding: 10px;
            font-size: 16px;
            margin: 4px 2px;
        }
    </style>

    <script>
    // Adicionar eventos de change aos selects
    document.getElementById('ponto').addEventListener('change', function() {
        var grupoSelect = document.getElementById('grupo');
        if (this.value) {
            grupoSelect.value = '';
            grupoSelect.disabled = true;
        } else {
            grupoSelect.disabled = false;
        }
    });

    document.getElementById('grupo').addEventListener('change', function() {
        var pontoSelect = document.getElementById('ponto');
        if (this.value) {
            pontoSelect.value = '';
            pontoSelect.disabled = true;
        } else {
            pontoSelect.disabled = false;
        }
    });

    function gerarGrafico() {
        var parametro = document.getElementById('parametro').value;
        var setor = document.getElementById('setor').value;
        var ponto = document.getElementById('ponto').value;
        var grupo = document.getElementById('grupo').value;
        
        if (!parametro) {
            alert('Por favor, selecione um parâmetro');
            return;
        }
        
        $.ajax({
            url: '{% url "resultados:get_grafico" %}',  // URL corrigida
            data: {
                'parametro': parametro,
                'setor': setor,
                'ponto': ponto,
                'grupo': grupo
            },
            success: function(response) {
                $('#grafico').html(response);
            },
            error: function(xhr, status, error) {
                alert('Erro ao gerar o gráfico: ' + error);
            }
        });
    }
    </script>
</div>
{% endblock %}
