{% extends 'base/base_site.html' %} 

{% load django_tables2 %} 
{% load static %}

{% block content %}  
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Campanhas agendadas</h2>

</div>

<div class="card checklist">
    <form method="get">
        {{ filtro.form.as_p }}
        <button type="submit" class="btn btn-primary">Filtrar</button>
    </form>
    <div class="table-responsive">
        <table class="table">
            {% render_table table_agenda_coleta %} 
        </table>
            <a href="{% url 'agendar_coleta' %}" class="btn btn-success">Criar Nova Campanha</a>
    </div>
</div>
{% endblock %}
