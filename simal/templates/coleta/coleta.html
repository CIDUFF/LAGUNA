{% extends 'base/base_site.html' %} 
{% load crispy_forms_tags %} 
{% block title %}Registro de coleta de Campo{% endblock %}
{% block content %} 
<div class="row">
  <div class="col-md-6">
    <div class="card bg-light mb-3">
      <div class="card-header text-dark">Código</div>
      <div class="card-body">
        <h5 class="card-title text-dark"></h5>
        <div class="text-dark text-wrap text-break">{{ codigo_coleta }}</div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card bg-light mb-3">
      <div class="card-header text-dark">Ponto</div>
      <div class="card-body">
        <h5 class="card-title text-dark"></h5>
        <div class="text-dark text-wrap text-break">{{ ponto }}</div>
      </div>
    </div>
  </div>
</div>
{% csrf_token %}
{% crispy form %} 
<!-- Botão para voltar para a lista de coletas -->
<a href="{% url 'lista_coleta' %}" class="btn btn-primary">Voltar para a lista de pontos</a>
{% endblock %}
